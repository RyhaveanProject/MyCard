<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryhavean | Bağlantılar</title>
    <style>
        body { 
            background: #0b0e14; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            -webkit-user-select: none;
            user-select: none;
        }
        h1 { margin-bottom: 20px; color: #00d2ff; }
        .links { width: 85%; max-width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .card { 
            background: #1a1f29; 
            padding: 15px; 
            text-align: center; 
            text-decoration: none; 
            color: white; 
            border-radius: 10px; 
            border: 1px solid #2d333b; 
            font-weight: bold; 
            transition: 0.3s;
        }
        .card:hover { background: #00d2ff; color: black; transform: scale(1.05); }
    </style>
</head>
<body oncontextmenu="return false">

    <h1>Ryhavean</h1>
    
    <div class="links">
        <a href="https://t.me/Ryhavean" class="card">Telegram</a>
        <a href="https://instagram.com/Ryhavean" class="card">Instagram</a>
        <a href="https://tiktok.com/@Ryhavean" class="card">TikTok</a>
        <a href="#" class="card">Discord: Ryhavean</a>
    </div>

    <script>
        // Sağ düymə qadağası
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
